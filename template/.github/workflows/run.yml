name: Run

# Full pipeline run. Triggered manually or by the nightly schedule.
# Dispatches the reusable run workflow at a pinned career-cards SHA.
#
# After creating this repo from the template, replace every occurrence of
# 0000000000000000000000000000000000000000 with the same 40-char SHA
# (the career-cards commit you want to run from), then add the required
# secrets and variables. See template/README.md.

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: "Trigger type (manual or scheduled)"
        required: false
        type: string
        default: manual
      label:
        description: "Run label (MMDD-HHMMz)"
        required: false
        type: string
        default: ''
      retried:
        description: "True when this is an automatic re-run after a crash"
        required: false
        type: boolean
        default: false
  # Uncomment to enable nightly runs:
  # schedule:
  #   - cron: '0 2 * * *'

run-name: "${{ github.event_name == 'schedule' && format('run-nightly-{0}', github.run_number) || format('run-{0}-{1}', inputs.trigger, inputs.label) }}"

permissions:
  contents: read
  actions: write

concurrency:
  group: run
  cancel-in-progress: false

jobs:
  call-run:
    uses: samartemberlin/career-cards/.github/workflows/run.yml@0000000000000000000000000000000000000000
    with:
      ref: "0000000000000000000000000000000000000000"
      trigger: ${{ inputs.trigger || 'scheduled' }}
      retried: ${{ inputs.retried || false }}
    secrets:
      TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
      TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

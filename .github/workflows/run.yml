name: Run (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: "40-character commit SHA of samartemberlin/career-cards to run from"
        required: true
        type: string
      trigger:
        description: "Run trigger: manual or scheduled"
        required: false
        type: string
        default: manual
      retried:
        description: "True when this is an automatic re-run after a crash"
        required: false
        type: boolean
        default: false
      caller_workflow:
        description: "Workflow file name to dispatch on retry"
        required: false
        type: string
        default: run.yml
    secrets:
      TRELLO_KEY:
        required: false
      TRELLO_TOKEN:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      GEMINI_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      GROQ_API_KEY:
        required: false

env:
  CLAUDE_CLI_VERSION: "2.1.322"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      reported: ${{ steps.run.outputs.reported }}
    steps:
      - name: Print parameters
        env:
          REF: ${{ inputs.ref }}
          TRIGGER: ${{ inputs.trigger }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "ref must be a 40-char SHA" >&2; exit 1; }
          echo "ref:        $REF"
          echo "trigger:    $TRIGGER"
          echo "repository: $GH_REPOSITORY"
          echo "ref_name:   $GH_REF_NAME"

      - name: Checkout career-cards at pinned SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: samartemberlin/career-cards
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # A shallow submodule fetch takes ~5 s (career-ops is ~60 MB, mostly docs and tests); a cache keyed by the
      # pinned submodule commit restores what the code reads in about a second.
      - name: Resolve career-ops commit
        id: career-ops
        run: |
          sha=$(git rev-parse HEAD:career-ops)
          echo "career-ops: $(git config -f .gitmodules submodule.career-ops.url) @ $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache career-ops
        id: career-ops-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            career-ops
            !career-ops/.git
            !career-ops/docs
            !career-ops/tests
          key: career-ops-${{ steps.career-ops.outputs.sha }}

      - name: Fetch career-ops (cache miss)
        if: steps.career-ops-cache.outputs.cache-hit != 'true'
        run: git -c protocol.version=2 submodule update --init --depth=1 career-ops

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      # Two runtime packages; Node strips types itself, so dev dependencies (typescript) are not needed.
      - name: Install dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Cache claude CLI
        id: claude-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/claude-cli
          key: claude-cli-${{ env.CLAUDE_CLI_VERSION }}

      - name: Install claude CLI
        if: steps.claude-cache.outputs.cache-hit != 'true'
        run: |
          npm install -g --prefix ~/.local/claude-cli @anthropic-ai/claude-code@${{ env.CLAUDE_CLI_VERSION }}
          echo "installed @anthropic-ai/claude-code@${{ env.CLAUDE_CLI_VERSION }}"

      - name: Add claude CLI to PATH and print versions
        run: |
          echo "$HOME/.local/claude-cli/bin" >> "$GITHUB_PATH"
          node --version
          ~/.local/claude-cli/bin/claude --version

      - name: Run pipeline
        id: run
        env:
          TRIGGER: ${{ inputs.trigger }}
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JOBS_BOARD_ID: ${{ vars.JOBS_BOARD_ID }}
          PROFILES_BOARD_ID: ${{ vars.PROFILES_BOARD_ID }}
          SYSTEM_BOARD_ID: ${{ vars.SYSTEM_BOARD_ID }}
          BOT_USERNAME: ${{ vars.BOT_USERNAME }}
        run: |
          trap 'echo "elapsed: $((SECONDS * 1000)) ms"' EXIT
          node src/main.ts run --trigger "$TRIGGER"

  retry:
    needs: run
    if: ${{ failure() && needs.run.outputs.reported != 'true' && !inputs.retried }}
    runs-on: ubuntu-latest
    permissions: { actions: write }
    steps:
      - name: Re-run once
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run "${{ inputs.caller_workflow }}" --repo "${{ github.repository }}" -f trigger="${{ inputs.trigger }}" -f retried=true

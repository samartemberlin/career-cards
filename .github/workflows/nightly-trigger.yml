name: Nightly trigger

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC
  workflow_dispatch:        # manual trigger for testing

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Start run
        env:
          SERVE_URL: ${{ secrets.SERVE_URL }}
          TRIGGER_SECRET: ${{ secrets.TRIGGER_SECRET }}
        run: |
          http=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${SERVE_URL}/trigger/run?key=${TRIGGER_SECRET}")
          echo "trigger: HTTP $http"
          # 202 = started, 409 = already running
          [[ "$http" == "202" || "$http" == "409" ]] || { echo "unexpected status $http" >&2; exit 1; }

      # Keeps the service awake on platforms with idle-sleep:
      #   Render: spins down after 15 min of no inbound HTTP.
      #   Koyeb free: scales to zero after 1 h with no inbound traffic.
      # Polls /healthz every 10 min for ~70 min.
      # Remove this step only if the platform never kills idle services.
      - name: Keepalive (prevent idle sleep during run)
        env:
          SERVE_URL: ${{ secrets.SERVE_URL }}
        run: |
          for i in $(seq 1 7); do
            sleep 600
            curl -sf "${SERVE_URL}/healthz" -o /dev/null && echo "keepalive $i/7 ok" || echo "keepalive $i/7 no-response"
          done

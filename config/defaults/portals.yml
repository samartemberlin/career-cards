# Shared sources for everyone. Scanned ONCE per night by career-ops (scan.mjs + scan-interamt.mjs).
# This file is only the shared base: src/search.mjs merges in each person's config/people/<p>/search.yml at run time
# (Bundesagentur keywords, extra employers), and keeps a posting if ANY person's `include` matches its title.
# So there is no positive title list here. `negative` applies to everybody; matching (career-ops) is a
# case-insensitive substring, 2-3 letter entries match on word boundaries, `word:` = whole word.
#
# Sources probed live on 2026-10-10.

title_filter:
  negative:
    # Legally unavailable to graduates. Kept deliberately small: everything
    # else (seniority, function) is decided per person.
    - "Werkstudent"
    - "Working Student"
    - "Studentische"
    - "Pflichtpraktikum"
    - "Duales Studium"
    - "Azubi"
    - "word:Ausbildung"
    - "Abschlussarbeit"

location_filter:
  allow:
    - "Berlin"
    - "Potsdam"
    - "Brandenburg"
    - "Remote"
    - "Homeoffice"
    - "Home Office"
    - "Worldwide"
    - "Anywhere"
    - "Global"
    - "Work from"
    - "Deutschland"
    - "Germany"
    - "Europe"
    - "EMEA"
  block:
    - "United States"
    - "USA"
    - "Canada"
    - "India"

# --- Aggregators ---------------------------------------------------------

job_boards:
  - name: Bundesagentur für Arbeit — Berlin
    provider: arbeitsagentur
    arbeitsagentur:
      wo: Berlin
      umkreis: 25
      days: 14            # with dedup against data/seen, survives a ~2-week gap
      remoteNationwide: true
      remoteMatch: filter
      remoteMaxPages: 3
    enabled: true

  - name: Arbeitnow
    provider: arbeitnow
    max_pages: 3
    enabled: true

# --- Interamt (German public sector: Senate departments, Bezirksämter, federal
# agencies, universities). Read by career-ops/scan-interamt.mjs (Playwright),
# NOT by scan.mjs — src/run.mjs must call it as a second step, see TODO there.
  # --- Remote / curated boards -------------------------------------------------------------------
  - name: Welcome to the Jungle — Berlin
    provider: wttj
    wttj:
      filters: 'offices.city:Berlin'
      max_hits: 1000
    enabled: true
  - name: We Work Remotely
    provider: weworkremotely
    enabled: true
  - name: Remotive
    provider: remotive
    enabled: true
  - name: Working Nomads
    provider: workingnomads
    enabled: true
  - name: Himalayas
    provider: himalayas
    enabled: true
  - name: Jobspresso
    provider: jobspresso
    enabled: true

interamt_searches:
  - was: "Projektkoordination"
  - was: "Projektassistenz"
  - was: "Projektmitarbeiter"
  - was: "Koordination"
  - was: "Teamassistenz"
  - was: "Assistenz"
  - was: "Referent"
  - was: "Öffentlichkeitsarbeit"
  - was: "Kommunikation"
  - was: "Veranstaltungsmanagement"
  - was: "Wissenschaftskoordination"
  - was: "Redaktion"

